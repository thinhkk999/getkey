<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GETKEY // TERMINUX VIP</title>
    <link rel="stylesheet" href="getkey.css">
</head>
<body>

<div class="key-container">
    <div class="key-header">
        <div><span class="status-dot"></span>TERMINUX KEY GENERATOR</div>
        <div>[SERVER SYNC]</div>
    </div>

    <div class="key-body">
        <div class="info-text">
            [+] Hệ thống cấp mã xác thực <strong>ROOTVER</strong> tự động.<br>
            [+] Sao chép mã bên dưới và quay lại trang chính để kích hoạt.
        </div>

        <!-- Ô hiển thị Key -->
        <div class="key-display-box">
            <input type="text" id="generatedKeyInput" value="Đang khởi tạo key..." readonly>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <!-- Nút Sao Chép -->
        <button class="btn copy-btn" id="copyKeyBtn">[ SAO CHÉP KEY ]</button>

        <!-- Nút Quay Lại Link Gốc -->
        <button class="btn back-btn" id="backHomeBtn">[ QUAY LẠI MENU CHÍNH ]</button>
    </div>
</div>

<!-- Nhúng JS dạng module để kết nối Firebase -->
<script type="module" src="getkey.js"></script>
</body>
</html>
