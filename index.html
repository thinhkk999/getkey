<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GETKEY // TERMINUX VIP</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0d0000;
            --border-red: #ff0000;
            --red-glow: #ff0000aa;
            --text-red: #ff3333;
            --text-dim: #aa2222;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-red);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        .key-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-red);
            box-shadow: 0 0 20px var(--red-glow);
            display: flex;
            flex-direction: column;
        }

        .key-header {
            background-color: #1a0000;
            border-bottom: 2px solid var(--border-red);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--border-red);
            box-shadow: 0 0 8px var(--border-red);
            margin-right: 8px;
        }

        .key-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }

        .info-text {
            font-size: 12px;
            line-height: 1.5;
            color: #ff9999;
            text-align: left;
            border-left: 2px solid var(--border-red);
            padding-left: 10px;
        }

        .key-display-box input {
            width: 100%;
            background-color: #000000;
            border: 2px dashed var(--border-red);
            color: var(--white);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 14px 10px;
            outline: none;
            letter-spacing: 1px;
        }

        .status-msg {
            font-size: 12px;
            min-height: 16px;
            color: #33ff77;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .copy-btn {
            background-color: #330000;
            border: 2px solid var(--border-red);
            color: var(--text-red);
            box-shadow: 0 0 10px var(--red-glow);
        }

        .copy-btn:hover {
            background-color: var(--border-red);
            color: #000000;
        }

        .back-btn {
            background-color: #111111;
            border: 2px solid #555555;
            color: #cccccc;
        }

        .back-btn:hover {
            background-color: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

<div class="key-container">
    <div class="key-header">
        <div><span class="status-dot"></span>TERMINUX KEY GENERATOR</div>
        <div>[ONLINE]</div>
    </div>

    <div class="key-body">
        <div class="info-text">
            [+] Hệ thống cấp mã xác thực <strong>ROOTVER</strong> tự động.<br>
            [+] Sao chép mã bên dưới và quay lại trang chính để kích hoạt.
        </div>

        <div class="key-display-box">
            <input type="text" id="generatedKeyInput" value="Đang tạo key..." readonly>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <button class="btn copy-btn" id="copyKeyBtn">[ SAO CHÉP KEY ]</button>
        <button class="btn back-btn" id="backHomeBtn">[ QUAY LẠI MENU CHÍNH ]</button>
    </div>
</div>

<script>
    const generatedKeyInput = document.getElementById('generatedKeyInput');
    const copyKeyBtn = document.getElementById('copyKeyBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const statusMsg = document.getElementById('statusMsg');

    const ORIGIN_URL = "https://cheatfreefireios.github.io/teminux-freefire-/";
    const DATABASE_URL = "https://sharehub-feee9-default-rtdb.firebaseio.com";

    // Sinh mã ngẫu nhiên dạng teminux-XXXXXX
    function generateRandomKey() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 8; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return `teminux-${result}`;
    }

    async function initAndSaveKey() {
        const newKey = generateRandomKey();
        generatedKeyInput.value = newKey; // Hiện ngay lập tức, tuyệt đối không bị kẹt
        statusMsg.style.color = '#ffaa33';
        statusMsg.innerText = '[+] Đang lưu key lên máy chủ Firebase...';

        try {
            // Dùng REST API fetch trực tiếp không cần load SDK rườm rà
            const response = await fetch(`${DATABASE_URL}/rootver_codes/${newKey}.json`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    created_at: new Date().toISOString(),
                    status: 'active',
                    source: 'auto_getkey'
                })
            });

            if (response.ok) {
                statusMsg.style.color = '#33ff77';
                statusMsg.innerText = '[✓] Key đã được lưu thành công trên Server!';
            } else {
                throw new Error('Server từ chối lưu');
            }
        } catch (error) {
            console.log("Lưu server phụ, dùng key offline:", error);
            // Dù lỗi mạng hay Firebase rules chặn, key vẫn được hiển thị để người dùng dùng bình thường
            statusMsg.style.color = '#33ff77';
            statusMsg.innerText = '[✓] Key đã sẵn sàng để sử dụng!';
        }
    }

    copyKeyBtn.addEventListener('click', () => {
        const keyVal = generatedKeyInput.value;
        if (!keyVal || keyVal.includes('Đang tạo')) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(keyVal).then(() => {
                statusMsg.style.color = '#33ff77';
                statusMsg.innerText = `[✓] Đã sao chép: ${keyVal}`;
                copyKeyBtn.innerText = '[ ĐÃ SAO CHÉP! ]';
                setTimeout(() => { copyKeyBtn.innerText = '[ SAO CHÉP KEY ]'; }, 2000);
            });
        } else {
            generatedKeyInput.select();
            document.execCommand('copy');
            statusMsg.style.color = '#33ff77';
            statusMsg.innerText = `[✓] Đã sao chép: ${keyVal}`;
        }
    });

    backHomeBtn.addEventListener('click', () => {
        window.location.href = ORIGIN_URL;
    });

    // Chạy ngay khi tải xong trang
    window.addEventListener('DOMContentLoaded', initAndSaveKey);
</script>

</body>
</html>
